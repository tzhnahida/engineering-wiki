<svg xmlns="http://www.w3.org/2000/svg" width="930" height="740" viewBox="0 0 930 740">
  <defs>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <polygon points="0,0 10,0 5,10" fill="#495057"/>
    </marker>
    <marker id="arrow-right" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#7950f2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="930" height="740" fill="#ffffff" rx="8"/>

  <!-- Title -->
  <text x="465" y="45" text-anchor="middle" font-size="26" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#1e1e1e">MCU 裸机软件六层架构</text>
  <line x1="200" y1="55" x2="730" y2="55" stroke="#dee2e6" stroke-width="1"/>

  <!-- ===== Vertical Layers (left) ===== -->

  <!-- app -->
  <rect x="60" y="100" width="380" height="85" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="250" y="126" text-anchor="middle" font-size="18" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#1e1e1e">app — 业务层</text>
  <text x="250" y="150" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">状态机 · 命令 · 控制策略</text>
  <text x="250" y="170" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">模式切换 · 联动逻辑</text>

  <!-- arrow: app → service -->
  <line x1="250" y1="185" x2="250" y2="212" stroke="#495057" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- service -->
  <rect x="60" y="215" width="380" height="85" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="250" y="241" text-anchor="middle" font-size="18" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#1e1e1e">service — 服务层</text>
  <text x="250" y="265" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">协议栈 · 日志 · 参数管理</text>
  <text x="250" y="285" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">诊断 · 升级 · 告警</text>

  <!-- arrow: service → device -->
  <line x1="250" y1="300" x2="250" y2="327" stroke="#495057" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- "调用/依赖" label -->
  <text x="260" y="318" font-size="12" font-family="Segoe UI, sans-serif" fill="#868e96">↓ 调用 / 依赖</text>

  <!-- device -->
  <rect x="60" y="330" width="380" height="85" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
  <text x="250" y="356" text-anchor="middle" font-size="18" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#1e1e1e">device — 设备层</text>
  <text x="250" y="380" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">传感器 · Flash · 电机 · 通信模组</text>
  <text x="250" y="400" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">I2C / SPI 设备语义化接口</text>

  <!-- arrow: device → bsp -->
  <line x1="250" y1="415" x2="250" y2="442" stroke="#495057" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- bsp -->
  <rect x="60" y="445" width="380" height="85" rx="8" fill="#ffc9c9" stroke="#c92a2a" stroke-width="2"/>
  <text x="250" y="471" text-anchor="middle" font-size="18" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#1e1e1e">bsp — 板级层</text>
  <text x="250" y="495" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">GPIO · UART · SPI · I2C</text>
  <text x="250" y="515" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">ADC · PWM · DMA · 定时器</text>

  <!-- arrow: bsp → platform -->
  <line x1="250" y1="530" x2="250" y2="557" stroke="#495057" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- platform -->
  <rect x="60" y="560" width="380" height="85" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="250" y="586" text-anchor="middle" font-size="18" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#1e1e1e">platform — 平台层</text>
  <text x="250" y="610" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">HAL · CMSIS · RTOS</text>
  <text x="250" y="630" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">启动文件 · CubeMX 生成代码</text>

  <!-- ===== Horizontal Reuse Layer (right) ===== -->

  <!-- component -->
  <rect x="660" y="215" width="210" height="315" rx="8" fill="#d0bfff" stroke="#7950f2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="765" y="260" text-anchor="middle" font-size="18" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#1e1e1e">component</text>
  <text x="765" y="282" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#6741d9">—— 横向复用层 ——</text>
  <text x="765" y="320" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">RingBuffer · CRC</text>
  <text x="765" y="342" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">PID · 状态机框架</text>
  <text x="765" y="364" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">软定时器 · FIFO</text>
  <text x="765" y="386" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">内存池 · 事件分发</text>
  <text x="765" y="416" text-anchor="middle" font-size="14" font-family="Segoe UI, sans-serif" fill="#495057">字符串处理 · 通用算法</text>

  <!-- legend under component -->
  <text x="765" y="555" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif" fill="#868e96">⚠ 与业务/硬件无关</text>
  <text x="765" y="572" text-anchor="middle" font-size="12" font-family="Segoe UI, sans-serif" fill="#868e96">可跨项目独立复用</text>

  <!-- ===== Horizontal Arrows: layers use component ===== -->

  <!-- "复用 →" label -->
  <text x="540" y="90" text-anchor="middle" font-size="13" font-family="Segoe UI, sans-serif" fill="#7950f2">复用 →</text>

  <line x1="440" y1="142" x2="655" y2="142" stroke="#7950f2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-right)"/>
  <line x1="440" y1="257" x2="655" y2="257" stroke="#7950f2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-right)"/>
  <line x1="440" y1="372" x2="655" y2="372" stroke="#7950f2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-right)"/>
  <line x1="440" y1="487" x2="655" y2="487" stroke="#7950f2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-right)"/>

  <!-- ===== Bottom: Init flow ===== -->
  <text x="60" y="680" font-size="13" font-family="Consolas, monospace" fill="#868e96">初始化：main → bsp_init → device_init → service_init → app_init → app_start</text>
</svg>
